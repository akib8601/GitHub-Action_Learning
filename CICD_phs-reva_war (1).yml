          kubectl get pods
          # Apply deployment
          kubectl apply -f yamls/deployment_reva-stage.yaml --validate=false
          kubectl rollout restart deployment reva-stage
          echo "Deployed war_file with dev build no. is = ${{ env.War_build_no }}"
          # Check deployment status and update deployEventG.json

  production_approval:
    name: Pause for production_approval
    if: ${{ needs.setup.outputs.environment == 'prod_elr' || needs.setup.outputs.environment == 'prod_ctc' }}
    runs-on: uhg-runner
    needs: [setup]
    environment:
      name: production_approval
      # reviewers:
      #   - your-github-username
    steps:
      - name: Awaiting Manual Approval
        run: echo "Workflow paused for manual approval. Please approve to continue."


  PROD_ELR:
