          cat yamls/deployment_reva-prd.yaml
          # Step 3: Download the certificate file
          wget https://k8s.optum.com/certs/hcck8s_ctc-ca.crt -O ctcprdusr001.crt
          echo "PRD_CTC_TOKEN=${{ secrets.PRD_CTC_TOKEN }}" | grep .
          mkdir -p .kube
          touch .kube/config
          # Set cluster (name must match in context)
          kubectl config set-cluster kubernetes --server=${{ env.HCCK8s_CTC_APISERVER }} --certificate-authority=ctcprdusr001.crt
          # Set credentials with token
          kubectl config set-credentials k8s-user --token="${{ secrets.PRD_CTC_TOKEN }}"
          # Set context (must use 'kubernetes' as cluster name)
          kubectl config set-context k8s --user=k8s-user --cluster=kubernetes --namespace=${{ env.HCCK8s_PROD_CTC_NAMESPACE }}
          # Use context
          kubectl config use-context k8s
          # Check current context
          kubectl config current-context
          # Get pods (should work)
          kubectl get pods
          # Apply deployment
          #kubectl apply -f yamls/deployment_reva-prd.yaml --validate=false
          #kubectl rollout restart deployment reva-prd
          echo "Deployed war_file with dev build no. is = ${{ env.War_build_no }}"
