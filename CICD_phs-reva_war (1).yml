        run: |
          WAR_URL="https://repo1.uhc.com:443/artifactory/UHG-Releases/com/optum/reva/phs_reva/${{ env.War_build_no }}/phs_reva.war"
          curl -u $ARTIFACTORY_CREDS_USR:$ARTIFACTORY_CREDS_PSW -X GET "$WAR_URL" -o phs_reva.war
