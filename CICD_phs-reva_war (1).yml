        run: |
          echo "Starting deployment to Kubernetes for ${{ github.event.inputs.environment }}"
          startTime=$(date +%s)
          echo "inside test"
          set +e
          # Load deployEventGJson
          deployEventGJsonData=$(cat deployEventG.json)
          sed -i "s,BASEDOCKER_IMAGE,${{ env.BASE_TEST_DOCKER_IMAGE }}," yamls/deployment_reva-test.yaml
          sed -i "s,WAR_FILE,${{ env.warfile }}," yamls/deployment_reva-test.yaml
          sed -i "s,WARFILE_URI,${DOWNLOADED_WAR_URL}," yamls/deployment_reva-test.yaml
          cat yamls/deployment_reva-test.yaml
          # Step 3: Download the certificate file
          wget https://k8s.optum.com/certs/hcck8s_elrnonprd-ca.crt -O hcck8s_elrnonprd-ca.crt
          echo "TEST_TOKEN=${{ secrets.TEST_TOKEN }}" | grep .
          mkdir -p .kube
          touch .kube/config
          # Set cluster (name must match in context)
          kubectl config set-cluster kubernetes --server=${{ env.HCCK8s_ELR_NONPRD_APISERVER }} --certificate-authority=hcck8s_elrnonprd-ca.crt
          # Set credentials with token
          kubectl config set-credentials k8s-user --token="${{ secrets.TEST_TOKEN }}"
          # Set context (must use 'kubernetes' as cluster name)
          kubectl config set-context k8s --user=k8s-user --cluster=kubernetes --namespace=${{ env.HCCK8s_TEST_NAMESPACE }}
          # Use context
          kubectl config use-context k8s
          # Check current context
          kubectl config current-context
          # Get pods (should work)
          kubectl get pods
          # Apply deployment
          kubectl apply -f yamls/deployment_reva-test.yaml --validate=false
          kubectl rollout restart deployment reva-test
          echo "Deployed war_file with dev build no. is = ${{ env.War_build_no }}"
          # Check deployment status and update deployEventG.json

  STAGE_ELR_NON_PRD:
    name: STAGE_ELR_NON_PRD
    if: ${{ needs.setup.outputs.environment == 'stage_elr' }}
    runs-on: uhg-runner
    needs: setup
    steps:
      - name: Checkout repository
