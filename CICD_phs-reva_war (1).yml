      - name: Set up environment variables
        run: |
          echo "BASE_TEST_DOCKER_IMAGE=$BASE_TEST_DOCKER_IMAGE" >> $GITHUB_ENV

      - name: Read deployEventG.json
        id: read-json
        run: |
          deployEventGJson=$(cat deployEventG.json)
